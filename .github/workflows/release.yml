name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build App & Package DMG
        run: |
          chmod +x build.sh package_dmg.sh
          ./build.sh
          ./package_dmg.sh

      - name: Upload DMG Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SmartDiskGuard-macOS-DMG
          path: dist/智能外接硬盘管家_安装包.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SmartDiskGuard ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/智能外接硬盘管家_安装包.dmg
