name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App & Package DMG
        run: |
          chmod +x build.sh package_dmg.sh
          ./build.sh
          ./package_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDiskGuard-macOS-DMG
          path: dist/智能外接盘管家_安装包.dmg
